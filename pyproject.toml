[project]
name = "audio-editor-tool"
version = "0.1.0"
description = "Audio editor for short song edits with smooth, beat-matched transitions"
readme = "README.md"
license = "MIT"
authors = [{ name = "Oskars Selis" }]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
audio-editor-tool = "audio_editor_tool.cli:main"
audio-editor-tool-gui = "audio_editor_tool.gui:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project]
name = "song-shortener"
version = "0.1.0"
description = "Shorten songs to a target length with smooth, beat-matched transitions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "soundfile>=0.14.0",
]

[project.scripts]
song-shortener = "song_shortener.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
